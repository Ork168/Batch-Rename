<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高速ファイル直打ちリネーム</title>
  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: #1d4ed8; }
    .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
    .btn-success { background-color: #16a34a; }
    .btn-success:hover { background-color: #15803d; }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
    }
    th { background-color: #f1f5f9; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-image { background: #dbeafe; color: #1e40af; }
    .badge-video { background: #fce7f3; color: #9d174d; }
    .status-ok { color: #16a34a; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <h2>📁 写真・動画の即時リネーム（直接書き換え）</h2>
  <p>指定したフォルダ内のファイル名を、データコピーやダウンロード保存なしで直接書き換えます。</p>
  
  <div style="margin-bottom: 20px; display: flex; gap: 12px;">
    <button id="btnSelect" class="btn">1. フォルダを選択</button>
    <button id="btnRename" class="btn btn-success" disabled>2. この内容で一括リネーム実行</button>
  </div>

  <div id="progressText" style="font-weight: bold; color: #2563eb; margin-bottom: 10px;"></div>

  <table>
    <thead>
      <tr>
        <th>種類</th>
        <th>現在のファイル名</th>
        <th>新しいファイル名（撮影/作成日時）</th>
        <th>状態</th>
      </tr>
    </thead>
    <tbody id="fileList">
      <tr><td colspan="4" style="text-align:center; color:#64748b;">フォルダを選択してください</td></tr>
    </tbody>
  </table>
</div>

<script>
  let dirHandle = null;
  const filesToRename = [];

  const btnSelect = document.getElementById('btnSelect');
  const btnRename = document.getElementById('btnRename');
  const fileList = document.getElementById('fileList');
  const progressText = document.getElementById('progressText');

  // フォルダ選択処理
  btnSelect.addEventListener('click', async () => {
    try {
      dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      filesToRename.length = 0;
      fileList.innerHTML = '';
      progressText.textContent = 'ファイルを解析中...';

      for await (const entry of dirHandle.values()) {
        if (entry.kind === 'file') {
          const file = await entry.getFile();
          const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
          
          if (['.jpg', '.jpeg', '.png', '.mp4', '.mov', '.m4v', '.webm', '.avi'].includes(ext)) {
            const date = await getFileDate(file);
            const newName = formatDate(date) + ext;

            filesToRename.push({
              handle: entry,
              oldName: file.name,
              newName: newName,
              type: ['.jpg', '.jpeg', '.png'].includes(ext) ? '写真' : '動画',
              statusCell: null
            });
          }
        }
      }

      renderList();
      progressText.textContent = `${filesToRename.length} 件の対象ファイルが見つかりました。`;
      btnRename.disabled = filesToRename.length === 0;

    } catch (err) {
      if (err.name !== 'AbortError') {
        alert('フォルダのアクセスに失敗しました: ' + err.message);
      }
    }
  });

  // リネーム実行処理（データの書き出しを行わず即時リネーム）
  btnRename.addEventListener('click', async () => {
    if (!dirHandle || filesToRename.length === 0) return;

    btnSelect.disabled = true;
    btnRename.disabled = true;
    let count = 0;

    for (const item of filesToRename) {
      try {
        if (item.oldName !== item.newName) {
          // File System Access APIのmove機能でディスク上の名前を直接変更
          await item.handle.move(item.newName);
        }
        item.statusCell.innerHTML = '<span class="status-ok">完了</span>';
        count++;
        progressText.textContent = `リネーム中... (${count} / ${filesToRename.length})`;
      } catch (err) {
        item.statusCell.textContent = 'エラー: ' + err.message;
      }
    }

    progressText.textContent = `処理が完了しました！（${count} 件）`;
    btnSelect.disabled = false;
  });

  // 日時取得 (Exif優先、無ければ最終更新日)
  function getFileDate(file) {
    return new Promise((resolve) => {
      if (file.type.startsWith('image/jpeg')) {
        EXIF.getData(file, function() {
          const exifDate = EXIF.getTag(this, 'DateTimeOriginal');
          if (exifDate) {
            const parts = exifDate.split(' ');
            const dateParts = parts[0].split(':');
            const timeParts = parts[1].split(':');
            resolve(new Date(dateParts[0], dateParts[1] - 1, dateParts[2], timeParts[0], timeParts[1], timeParts[2]));
            return;
          }
          resolve(new Date(file.lastModified));
        });
      } else {
        resolve(new Date(file.lastModified));
      }
    });
  }

  // 日時フォーマット (YYYYMMDD_HHMMSS)
  function formatDate(d) {
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  }

  // 一覧表示
  function renderList() {
    fileList.innerHTML = '';
    filesToRename.forEach(item => {
      const tr = document.createElement('tr');
      const badgeClass = item.type === '写真' ? 'badge-image' : 'badge-video';
      
      tr.innerHTML = `
        <td><span class="badge ${badgeClass}">${item.type}</span></td>
        <td>${item.oldName}</td>
        <td><b>${item.newName}</b></td>
        <td>待機中</td>
      `;
      item.statusCell = tr.children[3];
      fileList.appendChild(tr);
    });
  }
</script>

</body>
</html>
